<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>هشام و رنا</title>
  <meta name="description" content="السبت 5 ديسمبر 2026" />

  <!-- ============================================================

          website URL (the folder must be uploaded online, e.g.
          https://your-site.com/ or a subfolder like
          https://your-site.com/Hisham-Rana/).
       ============================================================ -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="هشام و رنا" />
  <meta property="og:title" content="هشام و رنا" />
  <meta property="og:description" content="السبت 5 ديسمبر 2026" />
  <meta property="og:url" content="https://YOUR-DOMAIN.com/" />
  <meta property="og:image" content="https://YOUR-DOMAIN.com/preview.jpg" />
  <meta property="og:image:secure_url" content="https://YOUR-DOMAIN.com/preview.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="هشام و رنا" />
  <meta name="twitter:description" content="السبت 5 ديسمبر 2026" />
  <meta name="twitter:image" content="https://YOUR-DOMAIN.com/preview.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&family=Lateef:wght@400;700&family=Pinyon+Script&display=swap"
    rel="stylesheet">

  <style>
    /* ============================================================
       THEME (change colors here)
       ============================================================ */
    :root {
      --bg: #f7f4ef;
      --fg: #2a2723;
      --muted: #6b6358;
      --accent: #b89866;
      --border: #d9d2c5;
      --shadow-soft: 0 30px 80px -40px rgba(42, 39, 35, .25);
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'Inter', system-ui, sans-serif;
      --script: 'Pinyon Script', cursive;
      --arabic: 'Aref Ruqaa', 'Amiri', serif;
      --arabic-calligraphy: 'Aref Ruqaa', 'Amiri', serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      letter-spacing: 0 !important;
    }

    html,
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      scroll-behavior: smooth;
    }

    :lang(ar),
    [lang="ar"],
    [dir="rtl"] {
      font-family: var(--arabic);
    }

    img {
      display: block;
      max-width: 100%;
    }

    h1,
    h2,
    h3 {
      font-family: var(--serif);
      font-weight: 400;
    }

    a,
    a:visited,
    a:hover,
    a:active,
    a:focus {
      color: inherit;
      text-decoration: none;
    }

    /* ---------- Poster screen ---------- */
    #poster-screen {
      position: fixed;
      inset: 0;
      z-index: 110;
      background: var(--bg);
      cursor: pointer;
      transition: opacity .5s ease;
    }

    #poster-screen img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preloader-text {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 10vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .75rem;
      text-align: center;
      padding: 0 1.5rem;
      pointer-events: none;
    }

    .preloader-text .ar {
      font-family: var(--serif);
      font-size: 1.75rem;
      color: #fff;
      text-shadow: 0 2px 14px rgba(0, 0, 0, .6);
      animation: softBob 2.4s ease-in-out infinite;
    }

    .preloader-text .en {
      font-family: var(--arabic);
      font-size: 1.1rem;
      color: #fff;
      text-shadow: 0 2px 14px rgba(0, 0, 0, .6);
      animation: softBob 2.4s ease-in-out infinite;
    }

    @media(min-width:640px) {
      .preloader-text .ar {
        font-size: 2rem;
      }
    }

    @keyframes softBob {

      0%,
      100% {
        transform: translateY(0);
        opacity: .85;
      }

      50% {
        transform: translateY(-6px);
        opacity: 1;
      }
    }

    /* ---------- Preloader video ---------- */
    .preloader {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--bg);
      cursor: pointer;
      transition: opacity .7s ease;
    }

    .preloader.closing {
      opacity: 0;
      pointer-events: none;
    }

    .preloader video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preloader-overlay {
      position: absolute;
      inset: 0;
      background: rgba(247, 244, 239, .2);
    }

    /* ---------- Common ---------- */
    .label {
      font-family: var(--serif);
      font-size: .7rem;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 400;
    }

    .italic {
      font-style: italic;
      font-size: 2rem;
      margin-top: 1rem;
    }

    @media(min-width:640px) {
      .italic {
        font-size: 2.5rem;
      }
    }

    .body {
      font-size: 1rem;
      line-height: 1.9;
      color: var(--muted);
      margin-top: 2rem;
    }

    .body.small {
      font-size: .875rem;
    }

    .script {
      font-family: var(--script);
      color: var(--accent);
      font-size: 1.875rem;
      margin-top: 2rem;
    }

    .script.big {
      font-size: 2.5rem;
    }

    @media(min-width:640px) {
      .script {
        font-size: 2.25rem;
      }

      .script.big {
        font-size: 3rem;
      }
    }

    .center {
      text-align: center;
    }

    .narrow {
      max-width: 48rem;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    section {
      padding: 0 1.5rem;
    }

    .divider {
      display: flex;
      justify-content: center;
      width: 88%;
      max-width: 640px;
      margin: 1.5rem auto;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(42, 39, 35, .4), transparent);
      position: relative;
    }

    .divider::before,
    .divider::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 6px;
      height: 6px;
      border: 1px solid rgba(42, 39, 35, .5);
      transform: translateY(-50%) rotate(45deg);
    }

    .divider::before {
      left: 48%;
    }

    .divider::after {
      right: 48%;
    }

    .section-divider {
      margin: 5rem auto;
      animation: floatSoft 7s ease-in-out infinite;
    }

    @keyframes floatSoft {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    /* ---------- Hero ---------- */
    .hero {
      position: relative;
      isolation: isolate;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 0 1rem;
      text-align: center;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    .hero-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 24rem;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform: translateY(-10vh);
      padding-bottom: 90px;
      animation: fadeIn 1.1s ease-out both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .couple {
      font-weight: 700;
      font-size: 4.1rem;
      line-height: 1.2;
      margin: .2rem 0 0;
      color: #211d19;
      text-shadow: 0 1px 0 rgba(255, 255, 255, .65);
    }

    @media(min-width:640px) {
      .couple {
        font-size: 4.8rem;
      }
    }

    @media(min-width:1024px) {
      .couple {
        font-size: 5.5rem;
      }
    }

    .hero-blessing {
      font-size: 2rem;
      color: var(--fg);
      margin-top: .4rem;
    }

    .hero-date {
      font-size: 1.45rem;
      color: #211d19;
      margin-top: 1.05rem;
    }

    .btn-outline {
      display: inline-block;
      margin-top: 2.5rem;
      border: 1px solid rgba(42, 39, 35, .4);
      background: rgba(247, 244, 239, .4);
      padding: .85rem 2rem;
      font-size: .72rem;
      text-transform: uppercase;
      backdrop-filter: blur(4px);
      transition: all .3s ease;
      cursor: pointer;
    }

    .btn-outline:hover {
      border-color: var(--fg);
      background: var(--fg);
      color: var(--bg);
    }

    .btn-outline.dark {
      font-family: var(--arabic);
      font-size: 1.05rem;
      text-transform: none;
      background: transparent;
      backdrop-filter: none;
    }

    /* ---------- Countdown ---------- */
    .countdown {
      text-align: center;
    }

    .countdown .label,
    .narrow .label,
    .venue .label,
    .time-section>.label,
    .dresscode-section .label {
      font-family: var(--serif);
      font-size: 1.35rem;
      text-transform: none;
      color: var(--fg);
      font-weight: 400;
    }

    .countdown-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: .75rem;
      max-width: 36rem;
      margin: 2.5rem auto 0;
    }

    @media(min-width:640px) {
      .countdown-grid {
        gap: 1.5rem;
      }
    }

    .countdown-grid>div {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .countdown-grid span {
      font-family: var(--serif);
      font-size: 2.5rem;
    }

    @media(min-width:640px) {
      .countdown-grid span {
        font-size: 3rem;
      }
    }

    @media(min-width:768px) {
      .countdown-grid span {
        font-size: 3.75rem;
      }
    }

    .countdown-grid em {
      font-style: normal;
      margin-top: .5rem;
      font-size: .65rem;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ---------- Venue ---------- */
    .venue {
      max-width: 56rem;
      margin: 0 auto;
    }

    /* ---------- Time ---------- */
    .time-section {
      padding: 1rem 1.5rem;
    }

    .time-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      max-width: 400px;
      margin: 0 auto;
    }

    .time-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .5rem;
    }

    .time-value {
      font-size: 4rem;
      color: #000 !important;
      line-height: 1;
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .time-value .am-pm {
      font-size: 1.5rem;
      font-family: var(--arabic);
    }

    .time-label {
      font-size: .9rem;
      color: #000;
    }

    .time-separator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      flex: 0.5;
      color: #000;
    }

    .time-separator .line {
      width: 25px;
      height: 1px;
      background-color: #000;
    }

    .time-separator .star {
      font-size: 1rem;
      color: #000;
    }

    /* ---------- Couple photos ---------- */
    .couple-photos-section {
      padding: 0 1.5rem;
      max-width: 52rem;
      margin: 0 auto;
    }

    .couple-photos-heading {
      font-size: 2.1rem;
      line-height: 1.5;
      margin-top: 0;
      margin-bottom: 0.4rem;
      color: #04253a !important;
    }

    @media (min-width: 640px) {
      .couple-photos-heading {
        font-size: 2.5rem;
      }
    }

    .couple-photos-list {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
      max-width: 360px;
      margin: 2rem auto 0;
    }

    .couple-photo-card {
      width: 100%;
      position: relative;
      transition: transform .4s ease;
    }

    .couple-photo-card:hover {
      transform: translateY(-4px);
    }

    .couple-photo-frame {
      padding: 8px;
      border: 1px dashed #c0b5a6;
      border-radius: 20px;
      background: rgba(255, 255, 255, .65);
      box-shadow: 0 15px 35px -10px rgba(42, 39, 35, .12);
    }

    .couple-photo-img-wrap {
      position: relative;
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      background: #ebe5dc;
      aspect-ratio: 3 / 4;
    }

    .couple-photo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 14px;
      transition: transform .8s cubic-bezier(.2, .8, .2, 1);
    }

    .couple-photo-card:hover .couple-photo-img {
      transform: scale(1.03);
    }

    /* ---------- Dress code ---------- */
    .dresscode-section {
      padding: 0 1.5rem;
      max-width: 44rem;
      margin: 0 auto;
    }

    .dresscode-subtitle {
      margin-top: .5rem !important;
      margin-bottom: 2rem !important;
      color: var(--muted);
    }

    .dresscode-card {
      padding: 2.25rem 1.25rem;
      border: 1px dashed #c0b5a6;
      border-radius: 20px;
      background: rgba(255, 255, 255, .65);
      box-shadow: 0 12px 30px -8px rgba(42, 39, 35, .08);
      max-width: 440px;
      margin: 0 auto;
    }

    .dresscode-palette {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.75rem .75rem;
      justify-items: center;
      align-items: start;
    }

    .dresscode-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .55rem;
      width: 100%;
    }

    .color-circle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid rgba(192, 181, 166, .45);
      box-shadow: 0 6px 16px -4px rgba(42, 39, 35, .15), inset 0 2px 4px rgba(255, 255, 255, .3);
      transition: transform .35s cubic-bezier(.2, .8, .2, 1), box-shadow .35s ease;
      cursor: pointer;
    }

    .dresscode-item:hover .color-circle {
      transform: translateY(-4px) scale(1.08);
      box-shadow: 0 12px 24px -4px rgba(42, 39, 35, .22);
    }

    .color-name {
      font-family: 'Inter', sans-serif !important;
      font-size: .75rem;
      font-weight: 500;
      color: var(--fg);
      text-align: center;
      line-height: 1.3;
    }

    @media (max-width: 400px) {
      .color-circle {
        width: 46px;
        height: 46px;
      }

      .color-name {
        font-size: .68rem;
      }

      .dresscode-palette {
        gap: 1.25rem .5rem;
      }

      .dresscode-card {
        padding: 1.75rem .75rem;
      }
    }

    /* ---------- Childhood ---------- */
    .childhood-heading {
      font-size: 2.2rem;
      line-height: 1.6;
      margin-bottom: 2rem;
      color: #04253a !important;
    }

    .childhood-frame {
      padding: 6px;
      border: 1px dashed #c0b5a6;
      border-radius: 16px;
      display: inline-block;
    }

    .childhood-frame img {
      border-radius: 12px;
      width: 100%;
      max-width: 340px;
      display: block;
    }

    /* ---------- Footer ---------- */
    .foot {
      padding: 0 1.5rem 4rem;
    }

    .branding {
      margin-top: 4rem;
      padding-top: 2.5rem;
      border-top: 1px solid rgba(42, 39, 35, .05);
    }

    .branding p {
      font-family: var(--serif);
      font-size: .85rem;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.25rem;
    }

    .social-links {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      margin-top: .75rem;
    }

    .social-links a {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(42, 39, 35, .2);
      background: rgba(247, 244, 239, .6);
      color: #2a2723;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all .3s cubic-bezier(.2, .8, .2, 1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
    }

    .social-links a svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
      display: block;
    }

    .social-links a:hover {
      background: #2a2723;
      color: #f7f4ef;
      border-color: #2a2723;
      transform: translateY(-3px);
      box-shadow: 0 8px 20px -6px rgba(42, 39, 35, .3);
    }

    /* ---------- Quran notice ---------- */
    .quran-music-notice {
      font-family: var(--arabic), sans-serif !important;
      font-size: 1rem;
      color: var(--muted);
      font-style: normal;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin-bottom: .5rem;
      cursor: pointer;
      transition: color .3s ease;
      line-height: 1.6;
    }

    .quran-music-notice:hover {
      color: var(--fg);
    }

    /* ---------- Music toggle ---------- */
    .music-toggle {
      position: fixed;
      left: 1rem;
      bottom: 1rem;
      width: 2.9rem;
      height: 2.9rem;
      border: 1px solid rgba(42, 39, 35, .35);
      border-radius: 999px;
      background: rgba(247, 244, 239, .88);
      color: #2a2723;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      z-index: 120;
      box-shadow: 0 10px 24px -16px rgba(0, 0, 0, .5);
      backdrop-filter: blur(2px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .5s ease;
    }

    .music-toggle.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .music-toggle.is-playing {
      background: var(--fg);
      color: var(--bg);
    }

    /* ---------- Reveal ---------- */
    .fade-up {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 1.2s cubic-bezier(.2, .7, .2, 1), transform 1.2s cubic-bezier(.2, .7, .2, 1);
    }

    .fade-up.in-view {
      opacity: 1;
      transform: translateY(0);
    }

    .cali-title {
      font-family: var(--arabic-calligraphy) !important;
      color: #000 !important;
      font-style: normal !important;
      font-weight: 400 !important;
    }
  </style>
</head>

<body>
  <!-- Poster / click-to-open screen -->
  <div id="poster-screen"></div>

  <!-- Preloader (optional video) -->
  <div id="preloader" class="preloader hidden-preload" style="display:none;">
    <video id="preloader-video" muted playsinline preload="auto"></video>
    <div class="preloader-overlay"></div>
  </div>

  <main id="app"></main>

  <audio id="bg-music" preload="auto" loop></audio>

  <button id="music-toggle" class="music-toggle" type="button" aria-label="تشغيل الموسيقى">♪</button>

  <script>
    /* ================================================================
       ⚙️  EDIT EVERYTHING HERE
       ================================================================
       - Change text, date, images, colors below.
       - Images can be:
           • a URL  →  "https://example.com/photo.jpg"
           • a local file in the same folder →  "images/photo1.jpg"
           • left as "" → a nice placeholder is shown automatically.
       - The countdown uses `date.iso` (year-month-dayThh:mm:ss).
       ================================================================ */
    const CONFIG = {

      /* ---------- Browser tab + link preview ---------- */
      meta: {
        title: "هشام و رنا",
        description: "15 / 10 / 2026",
        preview: "preview.jpg"          // image shown when the link is shared
      },

      /* ---------- Couple ---------- */
      couple: {
        groom: "هشام",
        bride: "رنا",
        display: "هشام و رنا",       // title on the hero + footer
        blessing: "جمعنا الله على خير",
        dateDisplay: "السبت 5 ديسمبر 2026"   // text shown under the names
      },

      /* ---------- Date & countdown target ---------- */
      date: {
        iso: "2026-12-05T18:00:00+02:00",     // used by the live countdown
        countdownLabel: "العد التنازلي",
        countdownHeading: "حتي اقول \"نعم\""
      },

      /* ---------- Opening / click-to-open ---------- */
      poster: {
        image: "poster.webp",          // full-screen image behind "click to open"
        ar: "أضغط لفتح الدعوة",
        en: "Click to open"
      },

      /* ---------- Optional intro video (leave "" to skip) ---------- */
      preloaderVideo: "",

      /* ---------- Background music (leave "" for no music) ---------- */
      music: "music.mp3",

      /* ---------- Quran verse ---------- */
      quran: {
        show: true,
        notice: "يرجى إيقاف الموسيقى قبل قراءة الآية القرآنية",
        text: "وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَاجًا لِّتَسْكُنُوا إِلَيْهَا وَجَعَلَ بَيْنَكُم مَّوَدَّةً وَرَحْمَةً"
      },

      /* ---------- Hero background image ---------- */
      heroImage: "hero.webp",

      /* ---------- Welcome ---------- */
      welcome: {

        "<defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>" +

        "<stop offset='1' stop-color='#efe9df'/></linearGradient></defs>" +
        "<rect width='100%' height='100%' fill='url(#g)'/>" +
        "<text x='50%' y='50%' fill='#b89866' font-family='Georgia, serif' " +
        "font-size='" + Math.round(w / 14) + "' text-anchor='middle' " +
        "dominant-baseline='middle'>" + label + "</text></svg>";
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);

        '<p dir="rtl" lang="ar" class="en">' + C.poster.en + '</p>' +
        '</div>';
    })();

    /* ================================================================
       Intro video + locking scroll
       ================================================================ */
    (function intro() {
      const posterScreen = document.getElementById("poster-screen");
      const pre = document.getElementById("preloader");
      const vid = document.getElementById("preloader-video");
      const C = CONFIG;
      let started = false, closed = false;

      document.body.style.overflow = "hidden";

      function showMusicToggle() {
        const t = document.getElementById("music-toggle");
        if (t && C.music) t.classList.add("visible");
      }

      function finish() {
        if (closed) return; closed = true;
        pre.classList.add("closing");
        showMusicToggle();
        setTimeout(function () {
          pre.style.display = "none";
          document.body.style.overflow = "";
        }, 800);
      }

      function start() {
        if (started) return; started = true;
        posterScreen.style.opacity = "0";
        setTimeout(function () {posterScreen.style.display = "none";}, 500);

        if (C.preloaderVideo && C.preloaderVideo.trim()) {
          pre.style.display = "";
          vid.src = C.preloaderVideo;
          try {
            vid.currentTime = 0;
            const p = vid.play();
            if (p && p.catch) p.catch(function () {setTimeout(finish, 600);});
          } catch (e) {setTimeout(finish, 600);}
        } else {
          finish();
        }
      }

      vid.addEventListener("ended", finish);
      posterScreen.addEventListener("click", start);
    })();

    /* ================================================================
       Countdown
       ================================================================ */
    (function countdown() {
      const target = new Date(CONFIG.date.iso).getTime();
      const dEl = document.getElementById("cd-days");
      const hEl = document.getElementById("cd-hours");
      const mEl = document.getElementById("cd-min");
      const sEl = document.getElementById("cd-sec");
      if (!dEl) return;

      function toArabicDigits(value) {
        return String(value).replace(/\d/g, function (d) {return "٠١٢٣٤٥٦٧٨٩"[d];});
      }
      function pad(n) {return toArabicDigits(String(n).padStart(2, "0"));}

      function tick() {
        const diff = Math.max(0, target - Date.now());
        dEl.textContent = pad(Math.floor(diff / 86400000));
        hEl.textContent = pad(Math.floor(diff / 3600000) % 24);
        mEl.textContent = pad(Math.floor(diff / 60000) % 60);
        sEl.textContent = pad(Math.floor(diff / 1000) % 60);
      }
      tick();
      setInterval(tick, 1000);
    })();

    /* ================================================================
       Reveal on scroll
       ================================================================ */
    (function reveal() {
      const els = document.querySelectorAll(".fade-up:not(.in-view)");
      const io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) {e.target.classList.add("in-view"); io.unobserve(e.target);}
        });
      }, {threshold: .12, rootMargin: "0px 0px -40px 0px"});
      els.forEach(function (el) {io.observe(el);});
    })();

    /* ================================================================
       Background music
       ================================================================ */
    (function music() {
      const music = document.getElementById("bg-music");
      const toggle = document.getElementById("music-toggle");
      if (!CONFIG.music || !CONFIG.music.trim()) {toggle.style.display = "none"; return;}

      music.src = CONFIG.music;
      let autoStarted = false;
      const unlockEvents = ["pointerdown", "touchstart", "click", "keydown"];

      function setToggleUI(isPlaying) {
        toggle.classList.toggle("is-playing", isPlaying);
        toggle.textContent = isPlaying ? "❚❚" : "♪";
        toggle.setAttribute("aria-label", isPlaying ? "إيقاف الموسيقى" : "تشغيل الموسيقى");
      }
      function playMusic() {
        return music.play().then(function () {setToggleUI(true); return true;})
          .catch(function () {setToggleUI(false); return false;});
      }
      function removeUnlock() {
        unlockEvents.forEach(function (n) {window.removeEventListener(n, onFirst, true);});
      }
      function onFirst() {
        if (autoStarted) return;
        playMusic().then(function (ok) {if (ok) {autoStarted = true; removeUnlock();} });
      }
      unlockEvents.forEach(function (n) {
        window.addEventListener(n, onFirst, {passive: true, capture: true});
      });

      toggle.addEventListener("click", function () {
        if (music.paused) {
          playMusic().then(function (ok) {if (ok && !autoStarted) {autoStarted = true; removeUnlock();} });
        } else {
          music.pause(); setToggleUI(false);
        }
      });

      music.addEventListener("pause", function () {setToggleUI(false);});
      music.addEventListener("play", function () {setToggleUI(true);});
      setToggleUI(false);

      const quranNotice = document.getElementById("quran-music-notice");
      if (quranNotice) {
        quranNotice.addEventListener("click", function () {
          if (!music.paused) {music.pause(); setToggleUI(false);}
        });
      }
    })();
  </script>
